name: API Automation Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Display Bruno version
        run: bru --version

      # Move to bruno folder before running
      - name: Run API Tests
        working-directory: ./bruno
        run: bru run
        continue-on-error: false

      - name: Test Summary
        if: always()
        run: |
          echo "=========================================="
          echo "API Automation Test Run Complete"
          echo "=========================================="
          echo "Tests executed using Bruno CLI"
          echo "Collection: bruno/bruno.json"
          echo "API: JSONPlaceholder (https://jsonplaceholder.typicode.com)"
          echo "=========================================="
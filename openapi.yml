openapi: 3.0.0
info:
  title: JSONPlaceholder API
  description: Free fake JSON API for testing and prototyping
  version: 1.0.0
  contact:
    name: JSONPlaceholder
    url: https://jsonplaceholder.typicode.com
  license:
    name: MIT

servers:
  - url: https://jsonplaceholder.typicode.com
    description: Production server

paths:
  /users:
    get:
      summary: Get all users
      description: Retrieve a list of all users
      operationId: getAllUsers
      tags:
        - Users
      responses:
        '200':
          description: Successful response with users array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
              example:
                - id: 1
                  name: Leanne Graham
                  username: Bret
                  email: Sincere@april.biz
                  phone: 1-770-736-8031 x56442
                  website: hildegard.org
                  company:
                    name: Romaguera-Crona
                    catchPhrase: Multi-layered client-server neural-net
                    bs: harness real-time e-markets

  /users/{id}:
    get:
      summary: Get user by ID
      description: Retrieve a specific user by their ID
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: The user ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Successful response with user object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                name: Leanne Graham
                username: Bret
                email: Sincere@april.biz
                phone: 1-770-736-8031 x56442
                website: hildegard.org
                company:
                  name: Romaguera-Crona
                  catchPhrase: Multi-layered client-server neural-net
                  bs: harness real-time e-markets
                address:
                  street: Kulas Light
                  suite: Apt. 556
                  city: Gwenborough
                  zipcode: 92998-3874
                  geo:
                    lat: -37.3159
                    lng: 81.1496

  /posts:
    get:
      summary: Get posts with optional filtering
      description: Retrieve posts, optionally filtered by userId
      operationId: getPosts
      tags:
        - Posts
      parameters:
        - name: userId
          in: query
          required: false
          description: Filter posts by user ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Successful response with posts array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
              example:
                - userId: 1
                  id: 1
                  title: sunt aut facere repellat provident occaecati excepturi optio reprehenderit
                  body: "quia et suscipit\nsuscipit recusandae consequuntur expedita et cum\nreprehenderit molestiae ut et quas molutas nostrum sunt\nincidunt ut aliquid ut aute repudiandae sint."
                - userId: 1
                  id: 2
                  title: qui est esse
                  body: "est rerum tempore vitae\nsequi sint nihil reprehenderit dolor beatae ea dolores neque\nfugiat blanditiis voluptate porro vel nihil molestiae ut reiciendis\nqui aperiam non debitis possimus qui neque nisi nulla"

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - username
        - email
      properties:
        id:
          type: integer
          description: User ID
          example: 1
        name:
          type: string
          description: User's full name
          example: Leanne Graham
        username:
          type: string
          description: User's username
          example: Bret
        email:
          type: string
          format: email
          description: User's email address
          example: Sincere@april.biz
        phone:
          type: string
          description: User's phone number
          example: 1-770-736-8031 x56442
        website:
          type: string
          description: User's website
          example: hildegard.org
        company:
          $ref: '#/components/schemas/Company'
        address:
          $ref: '#/components/schemas/Address'

    Company:
      type: object
      properties:
        name:
          type: string
          description: Company name
          example: Romaguera-Crona
        catchPhrase:
          type: string
          description: Company catchphrase
          example: Multi-layered client-server neural-net
        bs:
          type: string
          description: Business statement
          example: harness real-time e-markets

    Address:
      type: object
      properties:
        street:
          type: string
          example: Kulas Light
        suite:
          type: string
          example: Apt. 556
        city:
          type: string
          example: Gwenborough
        zipcode:
          type: string
          example: 92998-3874
        geo:
          $ref: '#/components/schemas/Geo'

    Geo:
      type: object
      properties:
        lat:
          type: number
          format: double
          example: -37.3159
        lng:
          type: number
          format: double
          example: 81.1496

    Post:
      type: object
      required:
        - userId
        - id
        - title
        - body
      properties:
        userId:
          type: integer
          description: ID of the user who created the post
          example: 1
        id:
          type: integer
          description: Post ID
          example: 1
        title:
          type: string
          description: Post title
          example: sunt aut facere repellat provident occaecati excepturi optio reprehenderit
        body:
          type: string
          description: Post body/content
          example: "quia et suscipit suscipit recusandae consequuntur expedita et cum"

    Comment:
      type: object
      properties:
        postId:
          type: integer
          description: ID of the post the comment belongs to
          example: 1
        id:
          type: integer
          description: Comment ID
          example: 1
        name:
          type: string
          description: Comment title/name
          example: id labore ex et quam laborum
        email:
          type: string
          format: email
          description: Commenter's email
          example: Eliseo@gardner.biz
        body:
          type: string
          description: Comment body
          example: "laudantium enim quasi est quidem magnam voluptate ipsam eos"

tags:
  - name: Users
    description: User-related operations
  - name: Posts
    description: Post-related operations
  - name: Comments
    description: Comment-related operations

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Browser - JSONPlaceholder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 14px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        button {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        button.active {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 18px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .card p {
            color: #666;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .card .id-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 40px;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-box .label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 JSONPlaceholder API Browser</h1>
            <p>Explore public API data in real-time. This frontend demonstrates the same API used in our automation tests.</p>
        </header>

        <div class="controls">
            <button onclick="loadUsers()" class="active">📋 Load Users</button>
            <button onclick="loadPosts()">📄 Load Posts</button>
            <button onclick="loadComments()">💬 Load Comments</button>
            <button onclick="clearResults()">🧹 Clear</button>
        </div>

        <div id="stats" class="stats"></div>

        <div id="loading" class="loading" style="display: none;">
            ⏳ Loading data...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="content">
            <div class="empty-state">
                <h2>🚀 Click a button above to start</h2>
                <p>Load users, posts, or comments from the public JSONPlaceholder API</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://jsonplaceholder.typicode.com';

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('content').innerHTML = '';
            document.getElementById('stats').innerHTML = '';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = '❌ ' + message;
            error.style.display = 'block';
            hideLoading();
        }

        function showStats(count, label) {
            const stats = document.getElementById('stats');
            stats.innerHTML = `<div class="stat-box"><div class="number">${count}</div><div class="label">${label}</div></div>`;
        }

        async function loadUsers() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/users`);
                if (!response.ok) throw new Error('Failed to load users');
                const users = await response.json();
                
                showStats(users.length, 'Users');
                displayUsers(users);
                hideLoading();
            } catch (error) {
                showError(error.message);
            }
        }

        async function loadPosts() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/posts`);
                if (!response.ok) throw new Error('Failed to load posts');
                const posts = await response.json();
                
                showStats(posts.length, 'Posts');
                displayPosts(posts.slice(0, 12)); // Show first 12
                hideLoading();
            } catch (error) {
                showError(error.message);
            }
        }

        async function loadComments() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/comments`);
                if (!response.ok) throw new Error('Failed to load comments');
                const comments = await response.json();
                
                showStats(comments.length, 'Comments');
                displayComments(comments.slice(0, 12)); // Show first 12
                hideLoading();
            } catch (error) {
                showError(error.message);
            }
        }

        function displayUsers(users) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="results">${users.map(user => `
                <div class="card">
                    <span class="id-badge">ID: ${user.id}</span>
                    <h3>${user.name}</h3>
                    <p><strong>Username:</strong> @${user.username}</p>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Company:</strong> ${user.company?.name || 'N/A'}</p>
                    <p><strong>City:</strong> ${user.address?.city || 'N/A'}</p>
                </div>
            `).join('')}</div>`;
        }

        function displayPosts(posts) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="results">${posts.map(post => `
                <div class="card">
                    <span class="id-badge">Post ID: ${post.id}</span>
                    <h3>${post.title}</h3>
                    <p>${post.body.substring(0, 100)}...</p>
                    <p><strong>By User:</strong> ${post.userId}</p>
                </div>
            `).join('')}</div>`;
        }

        function displayComments(comments) {
            const content = document.getElementById('content');
            content.innerHTML = `<div class="results">${comments.map(comment => `
                <div class="card">
                    <span class="id-badge">Comment ID: ${comment.id}</span>
                    <h3>${comment.name}</h3>
                    <p>${comment.body}</p>
                    <p><strong>By:</strong> ${comment.email}</p>
                </div>
            `).join('')}</div>`;
        }

        function clearResults() {
            document.getElementById('content').innerHTML = `
                <div class="empty-state">
                    <h2>🚀 Click a button above to start</h2>
                    <p>Load users, posts, or comments from the public JSONPlaceholder API</p>
                </div>
            `;
            document.getElementById('stats').innerHTML = '';
            document.getElementById('error').style.display = 'none';
        }
    </script>
</body>
</html>

name: JSONPlaceholder API Tests
type: collection
version: 1.0.0
description: Complete API automation testing collection for JSONPlaceholder public API

requests:
  - name: Get All Users
    uid: get-all-users
    method: GET
    url: https://jsonplaceholder.typicode.com/users
    body: null
    tests: |
      test("Status should be 200", function() {
        expect(res.getStatus()).to.equal(200);
      });
      
      test("Response should be an array", function() {
        expect(res.getBody()).to.be.an('array');
      });
      
      test("Should have at least 1 user", function() {
        const body = res.getBody();
        expect(body.length).to.be.greaterThan(0);
      });
      
      test("First user should have required fields", function() {
        const users = res.getBody();
        const firstUser = users[0];
        expect(firstUser).to.have.property('id');
        expect(firstUser).to.have.property('name');
        expect(firstUser).to.have.property('email');
      });

  - name: Get User by ID
    uid: get-user-by-id
    method: GET
    url: https://jsonplaceholder.typicode.com/users/1
    body: null
    tests: |
      test("Status should be 200", function() {
        expect(res.getStatus()).to.equal(200);
      });
      
      test("Response should be an object", function() {
        expect(res.getBody()).to.be.an('object');
      });
      
      test("User ID should be 1", function() {
        const body = res.getBody();
        expect(body.id).to.equal(1);
      });
      
      test("User should have correct name", function() {
        const body = res.getBody();
        expect(body.name).to.equal('Leanne Graham');
      });
      
      test("User should have email property", function() {
        const body = res.getBody();
        expect(body.email).to.exist;
        expect(body.email).to.be.a('string');
      });

  - name: Get Posts with Query Params
    uid: get-posts
    method: GET
    url: https://jsonplaceholder.typicode.com/posts?userId=1
    body: null
    tests: |
      test("Status should be 200", function() {
        expect(res.getStatus()).to.equal(200);
      });
      
      test("Response should be an array", function() {
        expect(res.getBody()).to.be.an('array');
      });
      
      test("Should have posts for userId 1", function() {
        const posts = res.getBody();
        expect(posts.length).to.be.greaterThan(0);
      });
      
      test("All posts should have userId 1", function() {
        const posts = res.getBody();
        posts.forEach(post => {
          expect(post.userId).to.equal(1);
        });
      });
      
      test("Each post should have required fields", function() {
        const posts = res.getBody();
        posts.forEach(post => {
          expect(post).to.have.property('id');
          expect(post).to.have.property('title');
          expect(post).to.have.property('body');
          expect(post).to.have.property('userId');
        });
      });

  - name: Negative Test - 404 Not Found
    uid: negative-test-404
    method: GET
    url: https://jsonplaceholder.typicode.com/users/99999
    body: null
    tests: |
      test("Status should be 200 (API returns 200 with empty object)", function() {
        expect(res.getStatus()).to.equal(200);
      });
      
      test("Response should be an object", function() {
        expect(res.getBody()).to.be.an('object');
      });
      
      test("Invalid ID should return empty response", function() {
        const body = res.getBody();
        expect(Object.keys(body).length).to.equal(0);
      });

  - name: Schema Validation Test
    uid: schema-validation
    method: GET
    url: https://jsonplaceholder.typicode.com/users/1
    body: null
    tests: |
      test("Response headers should include content-type", function() {
        expect(res.getHeader('content-type')).to.include('json');
      });
      
      test("User object schema validation", function() {
        const user = res.getBody();
        
        expect(user).to.have.property('id');
        expect(user).to.have.property('name');
        expect(user).to.have.property('username');
        expect(user).to.have.property('email');
        expect(user).to.have.property('phone');
        expect(user).to.have.property('website');
        expect(user).to.have.property('company');
        expect(user).to.have.property('address');
      });
      
      test("Field types should be correct", function() {
        const user = res.getBody();
        
        expect(user.id).to.be.a('number');
        expect(user.name).to.be.a('string');
        expect(user.username).to.be.a('string');
        expect(user.email).to.be.a('string');
        expect(user.company).to.be.an('object');
        expect(user.address).to.be.an('object');
      });
      
      test("Nested object validation", function() {
        const user = res.getBody();
        
        expect(user.company).to.have.property('name');
        expect(user.company.name).to.be.a('string');
        
        expect(user.address).to.have.property('street');
        expect(user.address).to.have.property('city');
        expect(user.address.street).to.be.a('string');
        expect(user.address.city).to.be.a('string');
      });
